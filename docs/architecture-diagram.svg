<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-diagram-title architecture-diagram-desc" id="architecture-diagram-root">
        <title id="architecture-diagram-title">PlaceMate system architecture</title>
        <desc id="architecture-diagram-desc">Students and coordinators use a Next.js app that calls a FastAPI edge, which routes to a RAG pipeline, a prep agent and deterministic tools; these use an LLM router, a FAISS and BM25 index over placement documents, and a SQLite database.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-diagram-root { --color-paper:   #ffffff;
      --color-ink:     #0b1f3a;
      --color-muted:   #475569;
      --color-accent:  #1d4ed8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-diagram-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-diagram-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-diagram-root .diagram-container { overflow-x: visible; }
}</style>
